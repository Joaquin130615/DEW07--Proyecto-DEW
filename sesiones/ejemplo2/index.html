<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clase 2 - El DOM en acción</title>
    <link rel="stylesheet" href="estilos.css">
    
</head>
<body>
    <header>
        <h1 id="titulo">Gestor de Productos</h1>
        <p id="subtitulo">Ejemplo para aprender el DOM</p>
    </header>

    <main>
        <!-- Zona de botones: cada uno llama a una función de app.js -->
        <section class="controles">
            <button onclick="saludar()">saludar</button>
            <button onclick="cambiarTitulo()">1. Cambiar título</button>
            <button onclick="cambiarColor()">2. Cambiar color</button>
            <button onclick="resaltarProductos()">3. Resaltar productos</button>
            <button onclick="cambiarImagen()">4. Cambiar imagen</button>
            <button onclick="contarProductos()">5. Contar productos</button>
        </section>

        <!-- Imagen que cambiaremos con setAttribute -->
        <img id="foto" src="https://picsum.photos/id/0/320/160" alt="foto">

        <!-- Lista de productos: los <li> tienen la clase "producto" -->
        <ul id="lista">
            <li class="producto">Teclado mecánico</li>
            <li class="producto">Mouse inalámbrico</li>
            <li class="producto">Monitor 24 pulgadas</li>
        </ul>

        <p id="mensaje"></p>
    </main>

    <script src="app.js"></script>
</body>
</html>
